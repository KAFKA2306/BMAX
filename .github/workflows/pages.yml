name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'benchmark/**'
      - 'data/convertible_benchmark.json'
      - 'data/market_snapshots/**'
      - 'data/scenarios/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build static artifact
        run: |
          mkdir -p _site/benchmark _site/data/market_snapshots _site/data/scenarios
          cp benchmark/index.html _site/benchmark/index.html
          cp data/convertible_benchmark.json _site/data/convertible_benchmark.json
          cp data/market_snapshots/*.json _site/data/market_snapshots/
          cp data/scenarios/*.json _site/data/scenarios/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed benchmark and canonical data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$base/benchmark/" -o /tmp/benchmark.html
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$base/data/convertible_benchmark.json" -o /tmp/convertible_benchmark.json
          grep -F 'Bitcoin Treasury Convertible Bond Benchmark' /tmp/benchmark.html
          grep -F 'PUBLIC CONTRACT COMPARISON' /tmp/benchmark.html
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/convertible_benchmark.json').read_text())
          assert len(data['issues']) >= 10
          assert len(data['issuers']) >= 5
          assert len(data.get('evidence', [])) > 0
          print({'issues': len(data['issues']), 'issuers': len(data['issuers']), 'evidence': len(data['evidence'])})
          PY
