name: Benchmark Contract

on:
  pull_request:
    paths:
      - 'src/benchmark_contract.py'
      - 'tests/test_benchmark_contract.py'
      - 'docs/convertible-benchmark-contract.md'
      - '.gitignore'
      - '.github/workflows/benchmark-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/benchmark_contract.py'
      - 'tests/test_benchmark_contract.py'
      - 'docs/convertible-benchmark-contract.md'
      - '.gitignore'
      - '.github/workflows/benchmark-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile contract validator
        run: python -m py_compile src/benchmark_contract.py tests/test_benchmark_contract.py
      - name: Run contract boundary tests
        run: python -m unittest tests.test_benchmark_contract -v
      - name: Remove runtime caches
        if: always()
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
      - name: Require clean checkout
        if: always()
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
