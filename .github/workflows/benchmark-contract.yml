name: Benchmark Contract

on:
  pull_request:
    paths:
      - 'src/benchmark_contract.py'
      - 'src/benchmark_repository.py'
      - 'src/benchmark_scenario.py'
      - 'src/bmax_computational_framework.py'
      - 'tests/test_benchmark_contract.py'
      - 'tests/test_benchmark_scenario.py'
      - 'data/convertible_benchmark.json'
      - 'data/market_snapshots/**'
      - 'data/scenarios/**'
      - 'docs/convertible-benchmark-contract.md'
      - '.gitignore'
      - '.github/workflows/benchmark-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/benchmark_contract.py'
      - 'src/benchmark_repository.py'
      - 'src/benchmark_scenario.py'
      - 'src/bmax_computational_framework.py'
      - 'tests/test_benchmark_contract.py'
      - 'tests/test_benchmark_scenario.py'
      - 'data/convertible_benchmark.json'
      - 'data/market_snapshots/**'
      - 'data/scenarios/**'
      - 'docs/convertible-benchmark-contract.md'
      - '.gitignore'
      - '.github/workflows/benchmark-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned scenario runtime
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - name: Compile contract and scenario modules
        run: |
          python -m py_compile src/benchmark_contract.py src/benchmark_repository.py src/benchmark_scenario.py tests/test_benchmark_contract.py tests/test_benchmark_scenario.py
      - name: Run contract boundary tests
        run: python -m unittest tests.test_benchmark_contract tests.test_benchmark_scenario -v
      - name: Remove runtime caches
        if: always()
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
      - name: Require clean checkout
        if: always()
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
